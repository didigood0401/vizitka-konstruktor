<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Визитка: живое демо</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&family=Cormorant+Garamond:wght@600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--c:#0f6b5c;--c2:#f2b134;--page:#14171d;--fg:#f1f3f7;--mut:#a8b0bf}
*{box-sizing:border-box;margin:0}
body{font:17px/1.5 Manrope,Arial,sans-serif;background:var(--page);color:var(--fg);padding:28px 16px}
.w{max-width:1120px;margin:0 auto}
h1{font:800 clamp(28px,4.4vw,48px)/1.12 Unbounded,Arial,sans-serif;margin-bottom:8px}
.lead{color:var(--mut);margin-bottom:26px;max-width:680px}
.g{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:32px;align-items:center}
.stage{perspective:1600px;display:flex;justify-content:center;padding:26px 0}
.card{position:relative;width:min(100%,600px);aspect-ratio:90/50;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.22,1,.36,1);cursor:pointer;border:0;background:none;padding:0;color:inherit;font:inherit;display:block}
.card.fl{transform:rotateY(180deg)}
.f{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:10px;overflow:hidden;box-shadow:0 24px 60px #0009;text-align:left}
.bk{transform:rotateY(180deg)}
/* style A: diagonal */
.a .fr{background:#fff;color:#16181d}
.a .fr:before{content:"";position:absolute;right:-22%;top:-30%;width:56%;height:170%;background:var(--c);transform:rotate(14deg)}
.a .fr:after{content:"";position:absolute;right:30%;top:-30%;width:2.2%;height:170%;background:var(--c2);transform:rotate(14deg)}
.a .bk{background:var(--c);color:#fff}
/* style B: premium */
.b .fr{background:var(--c);color:#fff}
.b .fr:before{content:"";position:absolute;inset:4.5%;border:1px solid var(--c2);border-radius:5px}
.b .fr:after{content:"";position:absolute;right:-14%;bottom:-48%;width:68%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 9px,var(--c2) 9px 10px);opacity:.6}.b .bk{background:#14161b;color:#fff}
.b .bk:before{content:"";position:absolute;inset:4.5%;border:1px solid var(--c2);border-radius:5px}
.b .n{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600}
/* style C: bold */
.c .fr{background:var(--c2);color:#14161b}
.c .fr:after{content:"";position:absolute;left:0;right:0;bottom:0;height:17%;background:var(--c)}
.c .bk{background:#fff;color:#14161b}
.c .bk:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6%;background:var(--c)}
.in{position:absolute;z-index:2;left:7.5%;top:13%;bottom:13%;width:50%;display:flex;flex-direction:column;justify-content:space-between}
.mk{width:clamp(38px,9.4cqw,60px);aspect-ratio:1;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font:800 clamp(17px,4cqw,26px) Unbounded,Arial}
.b .mk{background:none;border:1px solid var(--c2);color:var(--c2)}
.c .mk{background:#14161b;color:var(--c2)}
.n{font:800 clamp(17px,4.2cqw,28px)/1.1 Unbounded,Arial}
.r{font-size:clamp(11px,2.2cqw,15px);margin-top:4px}
.ctc{position:absolute;z-index:2;left:7.5%;right:7.5%;top:50%;transform:translateY(-50%);font-size:clamp(13px,2.9cqw,19px);line-height:1.65}
.ctc b{display:block;font:800 clamp(17px,4cqw,27px)/1.2 Unbounded,Arial;margin-bottom:8px}
.b .ctc b{font-family:"Cormorant Garamond",Georgia,serif}
.card{container-type:inline-size}
.pn{background:#1f242d;border-radius:12px;padding:22px;display:grid;gap:12px}
label{font-size:14px;color:var(--mut);display:grid;gap:4px}
input[type=text]{font:inherit;padding:12px;border-radius:8px;border:1px solid #ffffff33;background:#14171d;color:#fff;width:100%}
.cl{display:flex;gap:14px}
.cl label{flex:1}
input[type=color]{width:100%;height:44px;border:1px solid #ffffff33;border-radius:8px;background:#14171d;padding:3px;cursor:pointer}
.st{display:flex;gap:8px;flex-wrap:wrap}
.st button,.flip{font:800 14px Manrope,Arial;padding:12px 15px;border-radius:8px;border:1px solid #ffffff44;background:none;color:#fff;cursor:pointer}
.st button[aria-pressed=true]{background:#fff;color:#14171d}
.flip{display:block;margin:0 auto}
.foot{color:var(--mut);font-size:14px;margin-top:24px}
:focus-visible{outline:3px solid var(--c2);outline-offset:2px}
@media(max-width:820px){.g{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="w">
<h1>Ваша визитка уже здесь</h1>
<p class="lead">Введите свои данные и фирменные цвета справа: визитка обновится сразу. Нажмите на неё, чтобы перевернуть.</p>
<div class="g">
<div>
<div class="stage"><button class="card b" id="c" type="button" aria-label="Перевернуть визитку">
<div class="f fr"><div class="in"><div class="mk" id="mk"></div><div><div class="n" id="nm"></div><div class="r" id="rl"></div></div></div></div>
<div class="f bk"><div class="ctc"><b id="co"></b><div id="ph"></div><div id="ml"></div><div id="st"></div></div></div>
</button></div>
<button class="flip" id="fp" type="button">Перевернуть</button>
</div>
<div class="pn">
<div class="st" id="ss" role="group" aria-label="Стиль"><button type="button" data-s="b" aria-pressed="true">Вариант 1: Премиум</button><button type="button" data-s="a" aria-pressed="false">Вариант 2: Динамика</button></div>
<label>Компания<input type="text" id="iCo" value="Ваша компания"></label>
<label>Имя<input type="text" id="iNm" value="Имя Фамилия"></label>
<label>Должность<input type="text" id="iRl" value="Руководитель"></label>
<label>Телефон<input type="text" id="iPh" value="+7 900 000-00-00"></label>
<label>Почта или сайт<input type="text" id="iMl" value="hello@example.com"></label>
<div class="cl"><label>Основной цвет<input type="color" id="c1" value="#0f6b5c"></label><label>Акцент<input type="color" id="c2" value="#f2b134"></label></div>
</div>
</div>
<p class="foot">Демо: данные условные. Формат 90 × 50 мм. Вместо круга с буквой будет Ваш логотип.</p>
</div>
<script>
var $=function(i){return document.getElementById(i)},c=$('c');
function up(){$('nm').textContent=$('iNm').value;$('rl').textContent=$('iRl').value;$('co').textContent=$('iCo').value;$('ph').textContent=$('iPh').value;$('ml').textContent=$('iMl').value;$('mk').textContent=($('iCo').value.trim()[0]||'').toUpperCase()}
['iCo','iNm','iRl','iPh','iMl'].forEach(function(i){$(i).oninput=up});up();
$('c1').oninput=function(e){document.documentElement.style.setProperty('--c',e.target.value)};
$('c2').oninput=function(e){document.documentElement.style.setProperty('--c2',e.target.value)};
function flip(){c.classList.toggle('fl')}c.onclick=flip;$('fp').onclick=flip;
document.querySelectorAll('#ss button').forEach(function(b){b.onclick=function(){c.classList.remove('a','b','c');c.classList.add(b.dataset.s);document.querySelectorAll('#ss button').forEach(function(x){x.setAttribute('aria-pressed',x===b)})}});
</script>
</body>
</html>
